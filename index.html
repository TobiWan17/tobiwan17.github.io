<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --ink: #1c1b19;
      --muted: #6b675f;
      --accent: #c2410c;
      --panel-bg: #1c1b19;
      --panel-ink: #f4f1ea;
      --panel-width: min(420px, 88vw);
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    main { text-align: center; }

    h1 {
      font-size: clamp(2.2rem, 6vw, 3.6rem);
      font-weight: normal;
      letter-spacing: -0.02em;
    }

    .tagline {
      margin-top: 0.6rem;
      color: var(--muted);
      font-style: italic;
    }

    .buttons {
      margin-top: 2.4rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.9rem;
    }

    .btn {
      font: 600 0.82rem/1 system-ui, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--ink);
      background: transparent;
      border: 1.5px solid var(--ink);
      padding: 1rem 1.6rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    .btn:hover { background: var(--ink); color: var(--bg); }

    .btn:focus-visible,
    .close:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .btn--about { border-color: var(--accent); color: var(--accent); }
    .btn--about:hover { background: var(--accent); color: var(--bg); }

    /* Dimmed backdrop behind the panel */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(28, 27, 25, 0.45);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }

    /* Slide-in About panel */
    .panel {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--panel-width);
      height: 100%;
      padding: 3rem 2.2rem;
      background: var(--panel-bg);
      color: var(--panel-ink);
      overflow-y: auto;
      transform: translateX(100%);
      visibility: hidden;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.35s;
    }

    body.panel-open .overlay { opacity: 1; visibility: visible; }
    body.panel-open .panel { transform: translateX(0); visibility: visible; }

    .panel h2 {
      font-size: 2rem;
      font-weight: normal;
      margin-bottom: 1.2rem;
    }

    .panel p {
      line-height: 1.7;
      margin-bottom: 1rem;
      color: #d9d4c8;
    }

    .close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 2.5rem;
      height: 2.5rem;
      font-size: 1.6rem;
      line-height: 1;
      color: var(--panel-ink);
      background: none;
      border: none;
      cursor: pointer;
    }

    .close:hover { color: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
      .panel, .overlay, .btn { transition: none; }
    }
  </style>
</head>
<body>

  <main>
    <h1>Your Name</h1>
    <p class="tagline">A short line about what you do.</p>

    <div class="buttons">
      <!-- Replace the href values with your own profile URLs -->
      <a class="btn" href="https://github.com/your-username" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a class="btn" href="https://www.linkedin.com/in/your-username" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <button class="btn btn--about" id="aboutBtn" type="button" aria-controls="aboutPanel" aria-expanded="false">About</button>
    </div>
  </main>

  <div class="overlay" id="overlay"></div>

  <aside class="panel" id="aboutPanel" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
    <button class="close" id="closeBtn" type="button" aria-label="Close About panel">&times;</button>
    <h2 id="aboutTitle">About</h2>
    <p>Write a few sentences about yourself here: who you are, what you work on, and what you care about.</p>
    <p>Add a second paragraph for background, skills, or how to get in touch.</p>
  </aside>

  <script>
    const aboutBtn = document.getElementById('aboutBtn');
    const closeBtn = document.getElementById('closeBtn');
    const overlay = document.getElementById('overlay');

    function openPanel() {
      document.body.classList.add('panel-open');
      aboutBtn.setAttribute('aria-expanded', 'true');
      closeBtn.focus();
    }

    function closePanel() {
      document.body.classList.remove('panel-open');
      aboutBtn.setAttribute('aria-expanded', 'false');
      aboutBtn.focus();
    }

    aboutBtn.addEventListener('click', openPanel);
    closeBtn.addEventListener('click', closePanel);
    overlay.addEventListener('click', closePanel);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.body.classList.contains('panel-open')) {
        closePanel();
      }
    });
  </script>

</body>
</html>
